<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRUGS EXP ALERT — ระบบบันทึกและแจ้งเตือนยาใกล้หมดอายุ</title>
<meta name="theme-color" content="#fe6e00">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fe6e00'/%3E%3Cpath d='M12 22a4 4 0 0 1-5.6-5.6l7-7a4 4 0 0 1 5.6 5.6z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- ===== Login ===== -->
<section id="login" class="login">
  <div class="login-viz">
    <svg viewBox="0 0 420 260" role="img" aria-label="ภาพประกอบปฏิทินและแท่งสถิติยาใกล้หมดอายุ">
      <rect x="20" y="20" width="380" height="220" rx="12" fill="#fcfaf7" stroke="#e3e0dd"/>
      <rect x="20" y="20" width="380" height="44" rx="12" fill="rgba(254,110,0,.08)"/>
      <g fill="rgba(254,110,0,.60)">
        <rect x="50" y="170" width="30" height="50" rx="4"/><rect x="95" y="140" width="30" height="80" rx="4"/>
        <rect x="140" y="110" width="30" height="110" rx="4"/><rect x="185" y="150" width="30" height="70" rx="4"/>
        <rect x="230" y="125" width="30" height="95" rx="4"/><rect x="275" y="160" width="30" height="60" rx="4"/>
      </g>
      <rect x="320" y="100" width="64" height="120" rx="8" fill="#fff" stroke="#e3e0dd"/>
      <circle cx="352" cy="132" r="14" fill="#fe6e00"/><path d="M345 132h14M352 125v14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="332" y="160" width="40" height="6" rx="3" fill="#e3e0dd"/><rect x="332" y="174" width="28" height="6" rx="3" fill="#e3e0dd"/>
      <circle cx="44" cy="42" r="5" fill="#fe6e00"/><rect x="58" y="38" width="90" height="8" rx="4" fill="#e3e0dd"/>
    </svg>
    <h2>DRUGS EXP ALERT</h2>
    <p>บันทึกรายการยาใกล้หมดอายุ ออกรายงาน PDF และแจ้งเตือนผ่าน LINE OA โดยอัตโนมัติ</p>
  </div>
  <div class="login-panel">
    <div class="login-card">
      <h1>เข้าสู่ระบบ</h1>
      <p class="sub">ระบบบันทึกและแจ้งเตือนยาใกล้หมดอายุ</p>
      <div id="l-err"></div>
      <form id="l-form">
        <div class="field"><label for="l-user">ชื่อผู้ใช้</label><input class="input" id="l-user" autocomplete="username" required></div>
        <div class="field"><label for="l-pass">รหัสผ่าน</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" id="l-btn" style="width:100%" type="submit">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>
</section>

<!-- ===== App shell ===== -->
<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="logo"></span><div><b>DRUGS EXP</b><small>ALERT SYSTEM</small></div></div>
    <nav id="nav" aria-label="เมนูหลัก"></nav>
    <div class="side-foot">Google Sheets · Apps Script · LINE OA</div>
  </aside>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="สลับเมนู"></button>
    <div class="spacer"></div>
    <div class="conn" id="conn" role="status" aria-live="polite"><span class="dot"></span><span class="txt">กำลังตรวจสอบฐานข้อมูล…</span></div>
    <span class="userchip" id="user"></span>
    <button class="icon-btn" id="btn-out" aria-label="ออกจากระบบ" title="ออกจากระบบ"></button>
  </header>
  <div class="scrim"></div>
  <main id="view"></main>
</div>
<div id="toast" aria-live="polite"></div>

<script src="config.js"></script>
<script src="assets/pdfmake.min.js"></script>
<script src="assets/pdf-report.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
